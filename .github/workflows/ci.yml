name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── 2. Type-check ─────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  # ─── 3. Build ──────────────────────────────────────────────────────────────
  # Validates the Next.js build succeeds with production env vars.
  # The build fails loudly on type errors, missing modules, and bad imports —
  # a cleaner signal than running tests against a broken bundle.
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Provide dummy values so the build doesn't error on missing env checks.
      # The real secrets are in Vercel — these exist only to let `next build`
      # reach the env-var validation gate without bailing before even starting.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─── 4. Schema + RLS tests ─────────────────────────────────────────────────
  # Runs the PGlite-backed schema and RLS test suite.
  # These do NOT hit the live Supabase project — they spin up an in-process
  # Postgres-compatible instance, apply schema.sql, and assert access patterns.
  # The live Supabase credentials are NOT needed here and must NOT be added.
  db-tests:
    name: DB Tests (schema + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately ONE step that shells out to `test:db`, rather than
      # re-listing every gate here. This file previously duplicated the list by
      # hand and had silently drifted: test:permissions-rls (the entire RBAC
      # permission gate), test:backfill and test:verify-query were in test:db
      # but missing from CI, so they never ran on a pull request. Adding a gate
      # to package.json is now enough -- there is no second list to forget.
      - name: Run schema, RLS and unit test gates
        run: npm run test:db

  # ─── 5. Profile gates ──────────────────────────────────────────────────────
  # The six check:* gates the user-profile feature added. Before this job
  # existed, none of them ran in CI at all -- .github/workflows/ci.yml only
  # ever shelled out to test:db, and these six were never part of that list.
  # Four are pure source-reading gates with no live dependency. The other
  # two -- check:profile-rls (needs a Supabase URL/anon/service-role key) and
  # check:profile-action-auth (needs a running server at PROFILE_GATE_URL) --
  # are both written to SKIP cleanly and exit 0 when that dependency isn't
  # present, which it deliberately is not here: no .env.local exists in this
  # job and no server is started, so those two SKIP rather than fail, and the
  # other four still run for real.
  profile-gates:
    name: Profile gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run profile gates
        run: |
          npm run check:profile-rls
          npm run check:password-strength
          npm run check:avatar
          npm run check:profile-effective-name
          npm run check:profile-actions
          npm run check:profile-action-auth

  # ─── 6. Summary ────────────────────────────────────────────────────────────
  # A single required status check that depends on all jobs. Branch protection
  # rules point at this instead of each individual job, so adding a new job
  # only requires updating this list.
  all-checks:
    name: All checks passed
    needs: [lint, typecheck, build, db-tests, profile-gates]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.db-tests.result }}" != "success" ||
                "${{ needs.profile-gates.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
